<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你是 PHIGHTING! 裡的誰？</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

:root {
  --bg: #07080f;
  --bg2: #0d0f1e;
  --card: #111427;
  --card2: #181c35;
  --neon-cyan: #00f5ff;
  --neon-pink: #ff2d78;
  --neon-purple: #b44cff;
  --neon-yellow: #ffe600;
  --neon-green: #00ff9d;
  --text: #e8eaff;
  --text-dim: #7b80b0;
  --border: rgba(0,245,255,0.18);
  --glow-c: 0 0 16px rgba(0,245,255,0.5);
  --glow-p: 0 0 16px rgba(180,76,255,0.5);
  --radius: 12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* === SCANLINES BG === */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px);
  pointer-events: none;
  z-index: 0;
}

/* === GRID BG === */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,245,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,0.035) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

#app {
  position: relative;
  z-index: 1;
  max-width: 860px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

/* === HEADER === */
.site-header {
  text-align: center;
  padding: 48px 0 32px;
}

.game-label {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 6px;
  color: var(--neon-cyan);
  text-transform: uppercase;
  margin-bottom: 14px;
  opacity: 0.8;
}

.site-title {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(26px, 6vw, 52px);
  line-height: 1.1;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple), var(--neon-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: none;
  filter: drop-shadow(0 0 18px rgba(0,245,255,0.4));
  margin-bottom: 12px;
}

.site-sub {
  color: var(--text-dim);
  font-size: 14px;
  letter-spacing: 1px;
}

/* === PANELS === */
.panel {
  display: none;
  animation: fadeIn 0.4s ease;
}
.panel.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(16px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* === INTRO === */
.intro-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 36px 32px;
  text-align: center;
  box-shadow: 0 0 40px rgba(0,245,255,0.06);
  margin-bottom: 24px;
}

.intro-card p {
  color: var(--text-dim);
  font-size: 15px;
  line-height: 1.8;
  max-width: 540px;
  margin: 0 auto 28px;
}

.neon-pill {
  display: inline-flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 28px;
}

.neon-pill span {
  background: rgba(0,245,255,0.07);
  border: 1px solid rgba(0,245,255,0.25);
  border-radius: 99px;
  padding: 4px 14px;
  font-size: 12px;
  font-family: 'Orbitron', monospace;
  color: var(--neon-cyan);
  letter-spacing: 1px;
}

.btn-start {
  display: inline-block;
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 2px;
  color: var(--bg);
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-purple));
  border: none;
  border-radius: 8px;
  padding: 14px 44px;
  cursor: pointer;
  transition: filter 0.2s, transform 0.15s;
  box-shadow: 0 0 28px rgba(0,245,255,0.35);
}
.btn-start:hover { filter: brightness(1.15); transform: translateY(-2px); }
.btn-start:active { transform: translateY(0); }

/* === PROGRESS === */
.progress-wrap {
  margin-bottom: 24px;
}

.progress-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.progress-label {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  color: var(--neon-cyan);
  letter-spacing: 2px;
}

.progress-num {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  color: var(--text-dim);
}

.progress-bar-bg {
  background: rgba(0,245,255,0.08);
  border: 1px solid rgba(0,245,255,0.15);
  border-radius: 99px;
  height: 8px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
  border-radius: 99px;
  transition: width 0.4s cubic-bezier(.4,0,.2,1);
  box-shadow: 0 0 10px rgba(0,245,255,0.6);
}

/* === QUESTION CARD === */
.q-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 28px;
  margin-bottom: 20px;
  box-shadow: 0 0 40px rgba(0,245,255,0.04);
  animation: fadeIn 0.35s ease;
}

.q-category {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--neon-purple);
  margin-bottom: 10px;
  text-transform: uppercase;
}

.q-number {
  font-family: 'Orbitron', monospace;
  font-size: 36px;
  font-weight: 900;
  color: rgba(0,245,255,0.12);
  line-height: 1;
  margin-bottom: 6px;
}

.q-text {
  font-size: 18px;
  font-weight: 500;
  line-height: 1.6;
  color: var(--text);
  margin-bottom: 24px;
}

.options-grid {
  display: grid;
  gap: 10px;
}

.opt-btn {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--card2);
  border: 1px solid rgba(180,76,255,0.2);
  border-radius: 8px;
  padding: 14px 18px;
  color: var(--text);
  font-size: 14px;
  font-family: 'Noto Sans TC', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.opt-btn::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--neon-purple);
  opacity: 0;
  transition: opacity 0.2s;
}

.opt-btn:hover {
  border-color: rgba(180,76,255,0.6);
  background: rgba(180,76,255,0.1);
  box-shadow: 0 0 14px rgba(180,76,255,0.2);
  transform: translateX(3px);
}

.opt-btn:hover::before { opacity: 1; }

.opt-btn.selected {
  border-color: var(--neon-cyan);
  background: rgba(0,245,255,0.1);
  box-shadow: 0 0 16px rgba(0,245,255,0.25);
}

.opt-btn.selected::before {
  background: var(--neon-cyan);
  opacity: 1;
}

.opt-label {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  color: var(--neon-purple);
  letter-spacing: 1px;
  margin-right: 8px;
}

.opt-btn.selected .opt-label { color: var(--neon-cyan); }

/* === NAV BUTTONS === */
.nav-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 4px;
}

.btn-nav {
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 11px 26px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid;
}

.btn-prev {
  background: transparent;
  border-color: rgba(0,245,255,0.25);
  color: var(--neon-cyan);
}
.btn-prev:hover { background: rgba(0,245,255,0.08); }
.btn-prev:disabled { opacity: 0.3; cursor: not-allowed; }

.btn-next {
  background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 0 18px rgba(180,76,255,0.35);
}
.btn-next:hover { filter: brightness(1.12); transform: translateY(-1px); }
.btn-next:disabled { opacity: 0.35; cursor: not-allowed; filter: none; transform: none; }

/* === FACT BOX === */
.fact-box {
  background: rgba(180,76,255,0.07);
  border: 1px solid rgba(180,76,255,0.2);
  border-radius: 8px;
  padding: 14px 18px;
  font-size: 12px;
  color: var(--text-dim);
  margin-top: 16px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.fact-icon {
  font-size: 16px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* === RESULT PANEL === */
.result-hero {
  text-align: center;
  padding: 40px 0 28px;
}

.result-badge {
  font-family: 'Orbitron', monospace;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--neon-yellow);
  text-transform: uppercase;
  margin-bottom: 16px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.result-name {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: clamp(32px, 8vw, 64px);
  background: linear-gradient(135deg, var(--neon-yellow), var(--neon-pink), var(--neon-purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 0 20px rgba(255,230,0,0.4));
  margin-bottom: 8px;
  animation: glitch 4s infinite;
}

@keyframes glitch {
  0%,94%,100% { transform: none; }
  95% { transform: skewX(-2deg) translateX(2px); }
  96% { transform: skewX(2deg) translateX(-2px); }
  97% { transform: none; }
}

.result-class {
  display: inline-block;
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  padding: 5px 18px;
  border-radius: 99px;
  margin-bottom: 20px;
}
.class-melee  { background: rgba(255,45,120,0.15); border: 1px solid var(--neon-pink);   color: var(--neon-pink);   box-shadow: 0 0 12px rgba(255,45,120,0.3); }
.class-ranged { background: rgba(0,245,255,0.12);  border: 1px solid var(--neon-cyan);   color: var(--neon-cyan);   box-shadow: 0 0 12px rgba(0,245,255,0.3); }
.class-support{ background: rgba(0,255,157,0.1);   border: 1px solid var(--neon-green);  color: var(--neon-green);  box-shadow: 0 0 12px rgba(0,255,157,0.3); }

.result-img-wrap {
  width: 180px;
  height: 180px;
  margin: 0 auto 24px;
  border-radius: 50%;
  border: 2px solid var(--neon-yellow);
  box-shadow: 0 0 40px rgba(255,230,0,0.25), 0 0 80px rgba(255,230,0,0.1);
  overflow: hidden;
  background: var(--card2);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: spin-glow 6s linear infinite;
}

@keyframes spin-glow {
  0%   { box-shadow: 0 0 40px rgba(255,230,0,0.25), 0 0 80px rgba(255,230,0,0.1); }
  33%  { box-shadow: 0 0 40px rgba(180,76,255,0.35), 0 0 80px rgba(180,76,255,0.12); }
  66%  { box-shadow: 0 0 40px rgba(0,245,255,0.35), 0 0 80px rgba(0,245,255,0.12); }
  100% { box-shadow: 0 0 40px rgba(255,230,0,0.25), 0 0 80px rgba(255,230,0,0.1); }
}

.result-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.result-img-placeholder {
  font-size: 64px;
  filter: drop-shadow(0 0 12px rgba(255,230,0,0.5));
}

.similarity-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  margin-bottom: 32px;
}

.sim-label {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 2px;
}

.sim-pct {
  font-family: 'Orbitron', monospace;
  font-weight: 900;
  font-size: 28px;
  color: var(--neon-yellow);
  text-shadow: 0 0 14px rgba(255,230,0,0.5);
}

/* === RESULT CARDS === */
.result-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 28px 24px;
  margin-bottom: 16px;
}

.rs-title {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--neon-cyan);
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(0,245,255,0.12);
}

.rs-intro {
  font-size: 14px;
  line-height: 1.9;
  color: var(--text-dim);
  margin-bottom: 0;
}

.trait-list {
  list-style: none;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 0;
}

.trait-list li {
  background: rgba(0,245,255,0.07);
  border: 1px solid rgba(0,245,255,0.2);
  border-radius: 6px;
  padding: 6px 14px;
  font-size: 13px;
  color: var(--neon-cyan);
}

.strength-list, .caution-list {
  list-style: none;
}

.strength-list li, .caution-list li {
  padding: 9px 0 9px 22px;
  position: relative;
  font-size: 14px;
  line-height: 1.6;
  color: var(--text-dim);
  border-bottom: 1px solid rgba(0,245,255,0.06);
}

.strength-list li:last-child, .caution-list li:last-child { border-bottom: none; }

.strength-list li::before {
  content: '▲';
  position: absolute;
  left: 0;
  color: var(--neon-green);
  font-size: 10px;
  top: 12px;
}

.caution-list li::before {
  content: '●';
  position: absolute;
  left: 0;
  color: var(--neon-pink);
  font-size: 8px;
  top: 13px;
}

/* === CHART === */
.chart-wrap {
  overflow-x: auto;
}

.chart-bar-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 280px;
}

.chart-item {
  display: grid;
  grid-template-columns: 80px 1fr 36px;
  gap: 10px;
  align-items: center;
}

.chart-name {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text-dim);
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chart-track {
  background: rgba(255,255,255,0.05);
  border-radius: 99px;
  height: 8px;
  overflow: hidden;
}

.chart-fill {
  height: 100%;
  border-radius: 99px;
  transition: width 1s cubic-bezier(.4,0,.2,1);
}

.chart-val {
  font-family: 'Orbitron', monospace;
  font-size: 9px;
  color: var(--text-dim);
}

/* === SECOND CHAR === */
.second-char-card {
  background: var(--card2);
  border: 1px solid rgba(180,76,255,0.2);
  border-radius: 10px;
  padding: 20px;
  display: flex;
  gap: 20px;
  align-items: center;
}

.second-img {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: 2px solid rgba(180,76,255,0.5);
  object-fit: cover;
  background: var(--card);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  overflow: hidden;
}

.second-img img { width: 100%; height: 100%; object-fit: cover; }

.second-info { flex: 1; }

.second-name {
  font-family: 'Orbitron', monospace;
  font-weight: 700;
  font-size: 16px;
  color: var(--neon-purple);
  margin-bottom: 6px;
}

.second-text {
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.7;
}

/* === RESULT ACTIONS === */
.result-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 28px;
}

.btn-action {
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 12px 24px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid;
  text-transform: uppercase;
}

.btn-retry {
  background: transparent;
  border-color: rgba(0,245,255,0.35);
  color: var(--neon-cyan);
}
.btn-retry:hover { background: rgba(0,245,255,0.08); box-shadow: 0 0 14px rgba(0,245,255,0.2); }

.btn-share {
  background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
  border-color: transparent;
  color: #fff;
  box-shadow: 0 0 18px rgba(255,45,120,0.3);
}
.btn-share:hover { filter: brightness(1.12); }

/* === LOADING === */
.loading-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(7,8,15,0.9);
  z-index: 100;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
}
.loading-overlay.show { display: flex; }

.spinner {
  width: 56px; height: 56px;
  border: 3px solid rgba(0,245,255,0.15);
  border-top-color: var(--neon-cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-family: 'Orbitron', monospace;
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--neon-cyan);
  animation: pulse 1.2s infinite;
}

/* === TOAST === */
.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--card2);
  border: 1px solid var(--neon-cyan);
  border-radius: 8px;
  padding: 12px 24px;
  font-family: 'Orbitron', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--neon-cyan);
  box-shadow: 0 0 24px rgba(0,245,255,0.3);
  transition: transform 0.3s ease;
  z-index: 200;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* === RESPONSIVE === */
@media (max-width: 600px) {
  .q-card { padding: 22px 16px; }
  .result-section { padding: 20px 16px; }
  .second-char-card { flex-direction: column; text-align: center; }
  .chart-item { grid-template-columns: 64px 1fr 28px; }
  .intro-card { padding: 24px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div id="app">
  <header class="site-header">
    <div class="game-label">Roblox PHIGHTING!</div>
    <h1 class="site-title">你是誰？</h1>
    <p class="site-sub">15 題心理測驗 · 找出你的專屬 Phighter</p>
  </header>

  <!-- INTRO -->
  <div id="panel-intro" class="panel active">
    <div class="intro-card">
      <p>回答 15 道問題，系統將根據你的個性、思維方式與行動模式，精準配對 15 位 PHIGHTING! 角色中最像你的那一位。</p>
      <div class="neon-pill">
        <span>15 題</span>
        <span>15 角色</span>
        <span>動態分析</span>
        <span>無固定模板</span>
      </div>
      <button class="btn-start" onclick="startQuiz()">開始測驗</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="panel-quiz" class="panel">
    <div class="progress-wrap">
      <div class="progress-info">
        <span class="progress-label">PROGRESS</span>
        <span class="progress-num" id="prog-num">0 / 15</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="prog-fill" style="width:0%"></div>
      </div>
    </div>

    <div class="q-card" id="q-card">
      <div class="q-category" id="q-cat"></div>
      <div class="q-number" id="q-num-big"></div>
      <div class="q-text" id="q-text"></div>
      <div class="options-grid" id="options-grid"></div>
    </div>

    <div class="fact-box">
      <span class="fact-icon">⚡</span>
      <span id="fact-text"></span>
    </div>

    <div class="nav-row">
      <button class="btn-nav btn-prev" id="btn-prev" onclick="prevQ()" disabled>← 上一題</button>
      <button class="btn-nav btn-next" id="btn-next" onclick="nextQ()" disabled>下一題 →</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="panel-result" class="panel">

    <div class="result-hero">
      <div class="result-badge">✦ 你的 PHIGHTING! 角色 ✦</div>

    q: '你在合作中最無法忍受的是？',
    opts: [
      { text: '沒有人敢做決定，大家一直在等',           scores: {Sword:3, Biograft:2, Rocket:1} },
      { text: '規則不清楚，所有人各行其是',             scores: {BanHammer:3, Katana:2, Hyperlaser:1} },
      { text: '氣氛低迷，沒有人有熱情',                 scores: {Boombox:3, Slingshot:2, VineStaff:1} },
      { text: '明明有更好的方法卻沒人想探索',           scores: {Subspace:3, Coil:2, Shuriken:1} },
    ]
  },
  {
    cat: '獨處傾向',
    q: '你獨處的時候，最常做什麼？',
    opts: [
      { text: '練習技能或鍛鍊，不斷強化自己',           scores: {Katana:3, Hyperlaser:2, Biograft:1} },
      { text: '思考奇怪的問題或天馬行空地想像',         scores: {Subspace:3, Scythe:2, Coil:1} },
      { text: '享受當下的移動感或自由玩耍',             scores: {Skateboard:3, Rocket:2, Slingshot:1} },
      { text: '靜靜地為身邊的人想更多、做更多',         scores: {Medkit:3, VineStaff:2, BanHammer:1} },
    ]
  },
  {
    cat: '核心價值',
    q: '對你來說，最重要的事情是什麼？',
    opts: [
      { text: '自由——不受任何人與框架束縛',             scores: {Skateboard:3, Scythe:2, Rocket:1} },
      { text: '成長——每天都比昨天的自己更強',           scores: {Coil:3, Katana:2, Subspace:1} },
      { text: '連結——與身邊的人一起創造有意義的事',     scores: {VineStaff:3, Boombox:2, Medkit:1} },
      { text: '勝利——用最好的狀態拿下每一場戰鬥',       scores: {Sword:3, BanHammer:2, Hyperlaser:1} },
    ]
  },
];

const FACTS = [
  'PHIGHTING! 由 Roblox 遊戲工作室 Phighting! Team 開發，以快節奏的近未來 PvP 對戰聞名。',
  'Sword 被許多玩家認為是最具代表性的入門角色，擁有強力衝鋒技能。',
  'Medkit 是支援職中評價最穩定的角色之一，治療能力讓隊伍得以持續作戰。',
  'Subspace 的技能設計圍繞著空間與異次元概念，深受喜愛獨特玩法的玩家喜愛。',
  'Boombox 的音樂主題使他在視覺設計和技能上都獨樹一幟。',
  'Skateboard 以機動性著稱，能在戰場上快速穿梭。',
  'Hyperlaser 的狙擊精準度讓他在遠距戰鬥中幾乎無人能擋。',
  'Katana 的設計靈感來自武士精神，技能組合強調精準與紀律。',
  'Coil 是多功能角色，能適應多種戰術環境。',
  'Ban Hammer 象徵著秩序，是需要控場的局面中的最佳選擇。',
  'Vine Staff 是自然元素角色，治療與控制兼備。',
  'Shuriken 的快速攻擊模式讓對手難以預測下一步。',
  'Scythe 的黑暗風格讓他成為許多玩家最愛的「神秘系」角色。',
  'Biograft 是高效率的近戰機械戰士，攻擊直接且有力。',
  'Rocket 的爆炸性技能在群戰中能創造驚人的擊退效果。',
];

/* ============================
   STATE
   ============================ */
let currentQ = 0;
let answers = new Array(15).fill(null);
let scores = {};

/* ============================
   INIT
   ============================ */
function resetScores() {
  scores = {};
  KEYS.forEach(k => scores[k] = 0);
}

function startQuiz() {
  currentQ = 0;
  answers = new Array(15).fill(null);
  resetScores();
  showPanel('panel-quiz');
  renderQuestion();
}

function retryQuiz() {
  showPanel('panel-intro');
}

/* ============================
   QUIZ LOGIC
   ============================ */
function renderQuestion() {
  const data = QUESTIONS[currentQ];
  document.getElementById('q-cat').textContent = data.cat;
  document.getElementById('q-num-big').textContent = String(currentQ+1).padStart(2,'0');
  document.getElementById('q-text').textContent = data.q;

  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';

  const labels = ['A','B','C','D'];
  data.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn' + (answers[currentQ] === i ? ' selected' : '');
    btn.innerHTML = `<span class="opt-label">${labels[i]}</span>${opt.text}`;
    btn.onclick = () => selectOption(i);
    grid.appendChild(btn);
  });

  // progress
  const pct = Math.round((currentQ / 15) * 100);
  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-num').textContent = currentQ + ' / 15';

  // nav
  document.getElementById('btn-prev').disabled = currentQ === 0;
  document.getElementById('btn-next').disabled = answers[currentQ] === null;
  document.getElementById('btn-next').textContent = currentQ === 14 ? '查看結果 ✦' : '下一題 →';

  // fact
  document.getElementById('fact-text').textContent = FACTS[currentQ % FACTS.length];

  // animate card
  const card = document.getElementById('q-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = '';
}

function selectOption(idx) {
  answers[currentQ] = idx;
  document.querySelectorAll('.opt-btn').forEach((btn, i) => {
    btn.classList.toggle('selected', i === idx);
  });
  document.getElementById('btn-next').disabled = false;
}

function nextQ() {
  if (answers[currentQ] === null) return;
  if (currentQ === 14) {
    computeResult();
    return;
  }
  currentQ++;
  renderQuestion();
}

function prevQ() {
  if (currentQ === 0) return;
  currentQ--;
  renderQuestion();
}

/* ============================
   RESULT LOGIC
   ============================ */
function computeResult() {
  document.getElementById('loading').classList.add('show');
  resetScores();

  QUESTIONS.forEach((q, qi) => {
    const ans = answers[qi];
    if (ans === null) return;
    const sc = q.opts[ans].scores;
    Object.entries(sc).forEach(([k, v]) => {
      if (scores[k] !== undefined) scores[k] += v;
    });
  });

  setTimeout(() => {
    document.getElementById('loading').classList.remove('show');
    renderResult();
    showPanel('panel-result');
    window.scrollTo({top: 0, behavior: 'smooth'});
  }, 1800);
}

function renderResult() {
  const sorted = KEYS.slice().sort((a,b) => scores[b] - scores[a]);
  const top = sorted[0];
  const second = sorted[1];
  const char = CHARS[top];
  const char2 = CHARS[second];

  const maxPossible = 45; // rough max
  const pct = Math.min(99, Math.round((scores[top] / maxPossible) * 100));

  // name
  document.getElementById('r-name').textContent = char.name;

  // class badge
  const clsEl = document.getElementById('r-class');
  const clsMap = {Melee:'class-melee', Ranged:'class-ranged', Support:'class-support'};
  clsEl.innerHTML = `<span class="result-class ${clsMap[char.cls]}">${char.cls}</span>`;

  // image
  const wrap = document.getElementById('r-img-wrap');
  const img = new Image();
  img.onload = () => { wrap.innerHTML = ''; wrap.appendChild(img); img.style.cssText='width:100%;height:100%;object-fit:cover;'; };
  img.onerror = () => { wrap.innerHTML = `<span class="result-img-placeholder">${char.emoji}</span>`; };
  img.src = char.img;
  img.alt = char.name;
  // show placeholder while loading
  wrap.innerHTML = `<span class="result-img-placeholder">${char.emoji}</span>`;

  // pct
  document.getElementById('r-pct').textContent = pct + '%';

  // why
  const topTraits = getTopTraits(sorted);
  document.getElementById('r-why').textContent = generateWhy(top, topTraits, answers);

  // traits
  const traitEl = document.getElementById('r-traits');
  traitEl.innerHTML = '';
  char.traits.forEach(t => {
    const li = document.createElement('li');
    li.textContent = t;
    traitEl.appendChild(li);
  });

  // strengths
  const strEl = document.getElementById('r-strengths');
  strEl.innerHTML = '';
  char.strengths.forEach(s => {
    const li = document.createElement('li');
    li.textContent = s;
    strEl.appendChild(li);
  });

  // cautions
  const cauEl = document.getElementById('r-cautions');
  cauEl.innerHTML = '';
  char.cautions.forEach(c => {
    const li = document.createElement('li');
    li.textContent = c;
    cauEl.appendChild(li);
  });

  // second char
  renderSecond(second, char2, top, char);

  // chart
  renderChart(sorted.slice(0, 10));
}

function getTopTraits(sorted) {
  // Derive trait themes from answer patterns
  const traits = [];
  const ans = answers;

  // Q1: action style
  if (ans[0] === 0) traits.push('行動優先');
  else if (ans[0] === 1) traits.push('策略導向');
  else if (ans[0] === 2) traits.push('集體協作');
  else traits.push('深度研究');

  // Q4: competition
  if (ans[4] === 0) traits.push('強烈競爭心');
  else if (ans[4] === 1) traits.push('團隊合作為先');
  else if (ans[4] === 2) traits.push('享受過程');
  else traits.push('自我超越');

  // Q14: core value
  if (ans[14] === 0) traits.push('追求自由');
  else if (ans[14] === 1) traits.push('持續成長');
  else if (ans[14] === 2) traits.push('重視連結');
  else traits.push('渴望勝利');

  return traits;
}

function generateWhy(key, topTraits, ans) {
  const char = CHARS[key];
  const actionStyle = ['你傾向在行動中學習，先衝再說', '你喜歡事前充分準備，把每一步都想清楚', '你善用集體的力量，相信同伴的智慧', '你用深度思考找到別人沒想到的解法'][ans[0] ?? 0];
  const stressStyle = ['高壓下你的爆發力反而更強', '壓力讓你更加冷靜與有條理', '你靠著人與人的連結渡過難關', '你能快速找到問題核心並打破僵局'][ans[2] ?? 0];
  const valueStyle = ['自由是你最核心的驅動力', '不斷成長是你每天前進的引擎', '與他人的連結讓你的行動充滿意義', '追求勝利的熱情驅動著你的一切'][ans[14] ?? 0];

  return `${actionStyle}，這和 ${char.name} 的特質高度吻合。${stressStyle}，這正是 ${char.name} 在戰場上展現的姿態。${valueStyle}，讓你與 ${char.name} 的靈魂共鳴——${topTraits.join('、')}，這些都是你的核心印記。`;
}

function renderSecond(key2, char2, key1, char1) {
  const wrap = document.getElementById('r-second');
  const similarity = getSimilarityReason(key1, key2);
  const difference = getDifferenceReason(key1, key2);

  const imgDiv = document.createElement('div');
  imgDiv.className = 'second-img';

  const img = new Image();
  img.onload = () => { imgDiv.innerHTML = ''; imgDiv.appendChild(img); img.style.cssText='width:100%;height:100%;object-fit:cover;'; };
  img.onerror = () => { imgDiv.textContent = char2.emoji; };
  img.src = char2.img;
  imgDiv.textContent = char2.emoji; // placeholder

  const info = document.createElement('div');
  info.className = 'second-info';
  info.innerHTML = `
    <div class="second-name">${char2.name}</div>
    <div class="second-text">
      <strong style="color:var(--text)">相似原因：</strong>${similarity}<br><br>
      <strong style="color:var(--text)">與第一名的差異：</strong>${difference}
    </div>
  `;

  wrap.innerHTML = '';
  wrap.appendChild(imgDiv);
  wrap.appendChild(info);
}

function getSimilarityReason(k1, k2) {
  const c1 = CHARS[k1]; const c2 = CHARS[k2];
  if (c1.cls === c2.cls) return `兩者同屬 ${c1.cls} 職業，在行動與定位上有相似的節奏感。`;
  const shared = c1.traits.filter(t => c2.traits.includes(t));
  if (shared.length > 0) return `你們都有「${shared[0]}」的特質，在許多情境下會做出相近的選擇。`;
  return `在決策模式與面對壓力的方式上，${k1} 和 ${k2} 有著意外相似的內在邏輯。`;
}

function getDifferenceReason(k1, k2) {
  const c1 = CHARS[k1]; const c2 = CHARS[k2];
  if (c1.cls !== c2.cls) return `${k1} 是 ${c1.cls} 風格，更傾向${c1.traits[0]}；而 ${k2} 是 ${c2.cls} 風格，帶有更多${c2.traits[0]}的色彩。`;
  return `${k1} 更注重${c1.traits[1]}，${k2} 則在${c2.traits[1]}上有著獨特的體現。`;
}

function renderChart(sortedKeys) {
  const el = document.getElementById('r-chart');
  el.innerHTML = '';
  const maxScore = scores[sortedKeys[0]] || 1;

  const colors = [
    'linear-gradient(90deg,#ffe600,#ff2d78)',
    'linear-gradient(90deg,#b44cff,#00f5ff)',
    'linear-gradient(90deg,#00ff9d,#00f5ff)',
    'linear-gradient(90deg,#ff2d78,#b44cff)',
    'linear-gradient(90deg,#00f5ff,#00ff9d)',
    'linear-gradient(90deg,#ffe600,#b44cff)',
    'linear-gradient(90deg,#ff2d78,#ffe600)',
    'linear-gradient(90deg,#00ff9d,#b44cff)',
    'linear-gradient(90deg,#00f5ff,#ff2d78)',
    'linear-gradient(90deg,#b44cff,#ffe600)',
  ];

  sortedKeys.forEach((k, i) => {
    const w = maxScore > 0 ? Math.round((scores[k] / maxScore) * 100) : 0;
    const li = document.createElement('li');
    li.className = 'chart-item';
    li.innerHTML = `
      <span class="chart-name">${CHARS[k].name}</span>
      <div class="chart-track"><div class="chart-fill" style="width:0%;background:${colors[i%colors.length]}"></div></div>
      <span class="chart-val">${scores[k]}</span>
    `;
    el.appendChild(li);
    setTimeout(() => {
      li.querySelector('.chart-fill').style.width = w + '%';
    }, 200 + i * 80);
  });
}

/* ============================
   UI HELPERS
   ============================ */
function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function shareResult() {
  const name = document.getElementById('r-name').textContent;
  const pct = document.getElementById('r-pct').textContent;
  const text = `我在 PHIGHTING! 心理測驗中，測出了 ${name}（相似度 ${pct}）！你是誰呢？`;
  if (navigator.share) {
    navigator.share({ title: '你是 PHIGHTING! 裡的誰？', text });
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => showToast('已複製到剪貼簿！'));
  } else {
    showToast('已複製到剪貼簿！');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============================
   KEYBOARD SUPPORT
   ============================ */
document.addEventListener('keydown', e => {
  if (!document.getElementById('panel-quiz').classList.contains('active')) return;
  const labels = ['a','b','c','d'];
  const idx = labels.indexOf(e.key.toLowerCase());
  if (idx >= 0 && idx < QUESTIONS[currentQ].opts.length) selectOption(idx);
  if (e.key === 'ArrowRight' || e.key === 'Enter') {
    if (answers[currentQ] !== null) nextQ();
  }
  if (e.key === 'ArrowLeft') prevQ();
});
</script>
